# Öffentliche Vorschau auf GitHub Pages: bei jedem Push auf main bauen und veröffentlichen.
# VORSCHAU=1: Hinweis „Vorschau, noch nicht offiziell“ auf jeder Seite, nur Fotos mit geklärten Rechten.
# BASE_PATH: Pages liegt unter https://<konto>.github.io/<repository>/
name: Vorschau

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:contrast && npm run typecheck && npm run lint
      - run: npm run build
        env:
          VORSCHAU: "1"
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
